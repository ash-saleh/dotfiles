# -*- conf -*-
# Foot Terminal Configuration - Minimal Monochrome

[main]
font=JetBrainsMono Nerd Font Propo:size=12
font-bold=JetBrainsMono Nerd Font Propo:size=12:style=Bold
#pad=12x12

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.9
background=111111 
foreground=ffffff

## Normal Colors (Monochrome Mapping)
regular0=111111  # black
regular1=faefa2  # dim white/yellow accent
regular2=ffffff  # white
regular3=ffffff  # white
regular4=ffffff  # white
regular5=ffffff  # white
regular6=ffffff  # white
regular7=aaaaaa  # light gray

## Bright Colors
bright0=555555   # gray
bright1=ffffff   # white
bright2=ffffff   # white
bright3=ffffff   # white
bright4=ffffff   # white
bright5=ffffff   # white
bright6=ffffff   # white
bright7=ffffff   # white

[csd]
preferred=none
